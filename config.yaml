# ---------------------------------------------------------------
# Agent Survey configuration
# ---------------------------------------------------------------

years:
  start: 2023
  end: 2026   # inclusive; use current year

# DBLP venue keys (db/conf/<key> and db/journals/<key>)
venues:
  # Each entry has:
  #   name: search term used in DBLP `venue:` filter
  #   key_prefixes: list of DBLP record-key prefixes to keep (post-filter).
  #                 This excludes co-located workshops (e.g. conf/atest-ws/*).
  conferences:
    # Software Engineering
    - name: ICSE
      area: SE
      aliases: []
      key_prefixes: ["conf/icse/"]
    - name: FSE
      area: SE
      aliases: ["ESEC/FSE"]
      key_prefixes: ["conf/sigsoft/", "conf/fse/"]
    - name: ASE
      area: SE
      aliases: []
      key_prefixes: ["conf/kbse/"]
    - name: ISSTA
      area: SE
      aliases: []
      key_prefixes: ["conf/issta/"]

    # Security
    - name: SP
      area: Security
      aliases: []
      key_prefixes: ["conf/sp/"]
    - name: CCS
      area: Security
      aliases: []
      key_prefixes: ["conf/ccs/"]
    - name: USS
      area: Security
      aliases: []
      key_prefixes: ["conf/uss/"]
      toc_stream: "conf/uss/uss"
    - name: NDSS
      area: Security
      aliases: []
      key_prefixes: ["conf/ndss/"]

    # AI / ML
    - name: ICLR
      area: AI
      aliases: []
      key_prefixes: ["conf/iclr/"]
    - name: NeurIPS
      area: AI
      aliases: ["NIPS"]
      key_prefixes: ["conf/nips/"]
      # NeurIPS 2025: DBLP has not yet indexed the proceedings and OpenReview
      # has no public notes.  Will be re-enabled once DBLP adds the volume.
      skip_years: [2025]
    - name: ICML
      area: AI
      aliases: []
      key_prefixes: ["conf/icml/"]
    - name: AAAI
      area: AI
      aliases: []
      key_prefixes: ["conf/aaai/"]

    # NLP
    - name: ACL
      area: NLP
      aliases: []
      key_prefixes: ["conf/acl/"]
    - name: EMNLP
      area: NLP
      aliases: []
      key_prefixes: ["conf/emnlp/"]
    - name: NAACL
      area: NLP
      aliases: []
      key_prefixes: ["conf/naacl/"]
      # NAACL 2023 does not exist (conference was held in 2022 and 2024).
      skip_years: [2023]
    - name: COLM
      area: NLP
      aliases: []
      key_prefixes: ["conf/colm/"]
      # DBLP has no COLM index; use official mini-conf JSON export.
      # 2025 data is not yet updated on the site (returns 2024 copy),
      # so only 2024 is enabled for now.
      json_source_url: "https://colmweb.org/{year}/serve_papers.json"

    # HCI
    - name: CHI
      area: HCI
      aliases: []
      key_prefixes: ["conf/chi/"]
    - name: UIST
      area: HCI
      aliases: []
      key_prefixes: ["conf/uist/"]

  journals:
    - name: TOSEM
      area: SE
      aliases: ["ACM Trans. Softw. Eng. Methodol."]
      key_prefixes: ["journals/tosem/"]
      # DBLP `venue:TOSEM year:YYYY` returns 0 hits; use per-volume XML.
      journal_stream: "journals/tosem/tosem"
      journal_volumes:
        2023: [32]
        2024: [33]
        2025: [34]
        2026: [35]
    - name: TSE
      area: SE
      aliases: ["IEEE Trans. Software Eng."]
      key_prefixes: ["journals/tse/"]
      journal_stream: "journals/tse/tse"
      journal_volumes:
        2023: [49]
        2024: [50]
        2025: [51]
        2026: [52]

# ---------------------------------------------------------------
# Stage 2 prefilter — keyword regex
# Logic: include if agent_core matches, OR (agent_generic AND (se_context OR sec_context))
# Case-insensitive whole-word-ish matching against title+abstract
# ---------------------------------------------------------------
keywords:
  agent_core:
    # Direct agent-type keywords (hit = include)
    - "agent"  # single-word catch-all; noise (agency/agenda/reagent) is minimal
    - "GUI agent"
    - "computer use"
    - "computer-use"
    - "screen agent"
    - "web agent"
    - "browser agent"
    - "mobile agent"
    - "android agent"
    - "ios agent"
    - "desktop agent"
    - "os agent"
    - "visual agent"
    - "multimodal agent"
    - "autonomous agent"
    - "UI agent"
    - "app agent"
    - "AI agent"
    - "multi-agent"
    - "agent-based"
    - "LLM-powered agent"
    - "foundation model agent"
    - "large language model agent"
    # Strong benchmark / system signals (almost certainly agent papers)
    - "OSWorld"
    - "WebArena"
    - "Mind2Web"
    - "VisualWebArena"
    - "SWE-bench"
    - "SWEbench"
    - "GAIA"
    - "AgentBench"
    - "ToolBench"
    - "ReAct"
    - "tool learning"
    - "function calling"
    - "code agent"
    - "web navigation"
    - "GUI automation"
    - "automated testing"
  agent_generic:
    # Generic agent keywords (need se/sec context to include)
    - "LLM agent"
    - "LLM-based agent"
    - "language agent"
    - "agentic"
    - "language model agent"
    - "foundation model agent"
    - "tool-use"
    - "tool use agent"
    - "AI agent"
    - "multi-agent"
    - "agent-based"
  se_context:
    - "test generation"
    - "fuzzing"
    - "software testing"
    - "program repair"
    - "code generation"
    - "debugging"
    - "benchmark"
    - "regression test"
    - "GUI testing"
    - "Android testing"
    - "app testing"
    - "static analysis"
    - "dynamic analysis"
    - "bug"
    - "vulnerability detection"
    - "automated program repair"
    - "code agent"
    - "software agent"
  sec_context:
    - "prompt injection"
    - "jailbreak"
    - "adversarial"
    - "privacy leak"
    - "privacy"
    - "side channel"
    - "malware"
    - "vulnerability"
    - "penetration test"
    - "red team"
    - "attack"
    - "defense"
    - "exploit"
    - "LLM security"
    - "agent security"
    - "automated exploitation"

# ---------------------------------------------------------------
# LLM settings
# ---------------------------------------------------------------
llm:
  stage3_classify:
    model: deepseek-chat      # V4-Flash, non-thinking
    temperature: 0.0
    max_tokens: 512
    prompt_version: v1
  stage5_deepdive:
    model: deepseek-reasoner  # V4-Pro in thinking mode (higher quality structured extraction)
    temperature: 0.0
    max_tokens: 4096
    prompt_version: v1
  stage10_category_desc:
    model: deepseek-reasoner  # V4-Pro for category description generation
    temperature: 0.3
    max_tokens: 2048
    prompt_version: v1
  stage11_summary:
    model: deepseek-chat      # V4-Flash, fast bilingual paper summaries
    temperature: 0.0
    max_tokens: 512
    prompt_version: v1

# ---------------------------------------------------------------
# Output paths
# ---------------------------------------------------------------
paths:
  db: output/db/papers.sqlite
  json: output/json
  markdown: output/markdown
  obsidian: output/obsidian
  pdfs: output/pdfs
  llm_cache: cache/llm

# ---------------------------------------------------------------
# Network
# ---------------------------------------------------------------
network:
  user_agent: "agent-survey/0.1 (research; contact: local)"
  max_concurrency: 6
  request_timeout: 30
