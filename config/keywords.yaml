# Stage 2 prefilter — keyword regex
# Logic: include if agent_core matches, OR (agent_generic AND (se_context OR sec_context))
# Case-insensitive whole-word-ish matching against title+abstract
keywords:
  agent_core:
    # Direct agent-type keywords (hit = include)
    - "agent"  # single-word catch-all; noise (agency/agenda/reagent) is minimal
    - "GUI agent"
    - "computer use"
    - "computer-use"
    - "screen agent"
    - "web agent"
    - "browser agent"
    - "mobile agent"
    - "android agent"
    - "ios agent"
    - "desktop agent"
    - "os agent"
    - "visual agent"
    - "multimodal agent"
    - "autonomous agent"
    - "UI agent"
    - "app agent"
    - "AI agent"
    - "multi-agent"
    - "agent-based"
    - "LLM-powered agent"
    - "foundation model agent"
    - "large language model agent"
    # Strong benchmark / system signals (almost certainly agent papers)
    - "OSWorld"
    - "WebArena"
    - "Mind2Web"
    - "VisualWebArena"
    - "SWE-bench"
    - "SWEbench"
    - "GAIA"
    - "AgentBench"
    - "ToolBench"
    - "ReAct"
    - "tool learning"
    - "function calling"
    - "code agent"
    - "web navigation"
    - "GUI automation"
    - "automated testing"
  agent_generic:
    # Generic agent keywords (need se/sec context to include)
    - "LLM agent"
    - "LLM-based agent"
    - "language agent"
    - "agentic"
    - "language model agent"
    - "foundation model agent"
    - "tool-use"
    - "tool use agent"
    - "AI agent"
    - "multi-agent"
    - "agent-based"
  se_context:
    - "test generation"
    - "fuzzing"
    - "software testing"
    - "program repair"
    - "code generation"
    - "debugging"
    - "benchmark"
    - "regression test"
    - "GUI testing"
    - "Android testing"
    - "app testing"
    - "static analysis"
    - "dynamic analysis"
    - "bug"
    - "vulnerability detection"
    - "automated program repair"
    - "code agent"
    - "software agent"
  sec_context:
    - "prompt injection"
    - "jailbreak"
    - "adversarial"
    - "privacy leak"
