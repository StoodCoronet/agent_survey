# Enrich stage configuration
# ==========================
# Edit this file directly to adjust strategies and concurrency.
# Changes take effect on next `survey_agent enrich` run.

# Per-source worker pool sizes (global, shared across all venues).
# Set to 0 to disable a source entirely.
source_workers:
  s2: 2
  arxiv: 2
  meta: 30
  aclanthology: 10
  crossref: 10
  playwright: 5
  cache: 20

# Per-venue strategy: ordered source list.  First source is tried first;
# on failure, the paper falls through to the next source.
# Valid sources:
#   meta        — fast HTTP, HTML <meta> tags (citation_abstract, description)
#   aclanthology — ACL Anthology page scrape (httpx)
#   crossref    — Crossref DOI API (httpx)
#   playwright  — real headless browser (slow, JS-only pages)
#   s2          — Semantic Scholar API
#   arxiv       — arXiv API
#   cache       — local abstract_cache.sqlite
#   venue_fetcher — venue-specific scraper (USS, NDSS)
venue_strategies:
  # ── ACL Anthology → meta → playwright → S2 ──
  EMNLP: ["meta"]
  NAACL: ["meta"]
  ACL: ["meta"]

  # ── meta first (fast HTTP, 50+ RPS) → fallback ──
  ICLR: ["meta", "s2"]
  ICML: ["meta", "s2"]
  AAAI: ["meta", "s2"]
  NeurIPS: ["meta", "s2"]

  # ── meta (ASE/IEEE has og:description) ──
  ASE: ["meta", "s2"]
  FSE: ["meta", "s2"]
  ICSE: ["meta", "s2"]
  SP: ["meta", "s2"]
  # ── s2 only (paywall blocks HTTP, meta < 1s fast-fail) ──
  CCS: ["meta", "s2"]
  COLM: ["meta", "s2"]
  CHI: ["meta", "s2"]
  ISSTA: ["meta", "s2"]
  UIST: ["meta", "s2"]
  TSE: ["meta", "s2"]
  TOSEM: ["meta", "s2"]
  NDSS: ["meta", "s2"]

  # ── Venue fetcher ──
  USS: []
