# Classify stage configuration

limit: 0

llm:
  workers: 20           # parallel DeepSeek API calls (keep ≤20 to avoid connection pool exhaustion)
  batch_size: 5        # papers per single LLM call
  model: "deepseek-v4-flash"
  temperature: 0.0
  max_tokens: 2048
  timeout: 120.0       # seconds per API call
