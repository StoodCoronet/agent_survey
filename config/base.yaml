# ---------------------------------------------------------------
# Base configuration
# ---------------------------------------------------------------

# NOTE: API keys should be placed in config/secrets.yaml (gitignored).
# The file below is tracked; keep placeholder values here.
api_keys:
  deepseek: ""
  semantic_scholar: ""
  core: ""

deepseek_base_url: "https://api.deepseek.com"

years:
  start: 2023
  end: 2026   # inclusive; use current year

paths:
  db: output/db/papers.sqlite
  json: output/json
  markdown: output/markdown
  obsidian: output/obsidian
  pdfs: output/pdfs
  llm_cache: cache/llm

# Currently active survey topic (must match a file in topics/<name>.yaml)
active_topic: llm-se-tools

# ---------------------------------------------------------------
# Docs site
# ---------------------------------------------------------------
docs:
  server_port: 48000
