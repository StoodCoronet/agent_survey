# =============================================================================
# Topic: GUI Agent Survey
# Computer-use / GUI agent papers from SE/Security/AI venues
# =============================================================================

name: "GUI Agent Survey"
description: >
  Crawl AI-agent papers (especially computer-use / GUI agent) from SE /
  Security / AI venues (2023–now), classify them, and produce a survey
  with Obsidian, Markdown, and JSON outputs.

# ------ Prefilter keywords ------
