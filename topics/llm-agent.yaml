    - "large language model agent"
    - "OSWorld"
    - "WebArena"
    - "Mind2Web"
    - "VisualWebArena"
    - "SWE-bench"
    - "SWEbench"
    - "GAIA"
    - "AgentBench"
    - "ToolBench"
    - "ReAct"
