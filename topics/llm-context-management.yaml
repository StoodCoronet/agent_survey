search_queries:
  - "example query"

classify:
  relevance_levels:
    - core
    - related
    - adjacent
    - irrelevant
  domain_labels:
    - "Context Compression"
    - "Memory Architecture"
    - "Retrieval / Knowledge Augmentation"
    - "Dialogue / Session Management"
    - "Context-Aware Agent"
    - "Context Security / Defense"
    - "Context Extension"
    - "Context Detection / Inference"
  method_labels:
    - "Survey / Review"
    - "Benchmark / Dataset"
    - "Framework / System"
    - "Method / Algorithm"
    - "Empirical Study"
    - "Theoretical Analysis"
  system_prompt: |
    You are a meticulous research assistant classifying papers for a survey on **LLM Context Management in Applications** (chatbots, agents, expert systems, and skill-based systems).

    Focus on **application-level** context management: how systems organize, compress, retrieve, secure, and reason over context when LLMs are used in real-world applications.

    EXCLUDE papers that are purely about:
    - Low-level model optimizations (KV cache compression, quantization, pruning)
    - Position encoding / attention architecture (RoPE, ALiBi, sparse attention, Flash Attention)
    - General model training or fine-tuning without context-management focus
    - Pure computer vision, robotics, or bioinformatics

    Unless the paper explicitly connects these techniques to **context management in applications** (e.g., "we use KV cache compression to enable longer agent conversations"), mark them as "adjacent" or "irrelevant".

    You must respond with strict JSON only.
  user_prompt_template: |
    Classify this paper for a survey on LLM Context Management in Applications.

    Paper:
    - Title: {title}
    - Venue: {venue}
    - Year: {year}
    - Abstract: {abstract}

    Relevance levels: {relevance_levels}
    Domain labels: {domain_labels}
    Method labels: {method_labels}

    Return strict JSON:
    {{
      "relevance": "core|related|adjacent|irrelevant",
      "domain_primary": "one of the domain labels",
      "domain_secondary": "optional second domain",
      "method_tags": ["one or more method labels"],
      "tldr": "1-sentence summary of contribution (omit if irrelevant)",
      "rationale": "why this relevance and domain (omit if irrelevant)"
    }}
  user_prompt_title_only: |
    Classify this paper (title only) for a survey on LLM Context Management in Applications.

    Paper:
    - Title: {title}
    - Venue: {venue}
    - Year: {year}

    Relevance levels: {relevance_levels}
    Domain labels: {domain_labels}
    Method labels: {method_labels}

    Return strict JSON:
    {{
      "relevance": "core|related|adjacent|irrelevant",
      "domain_primary": "one of the domain labels",
      "domain_secondary": "optional second domain",
      "method_tags": ["one or more method labels"],
      "tldr": "1-sentence summary",
      "rationale": "why this relevance and domain"
    }}
  batch_user_prompt_template: |
    Classify {count} papers for a survey on LLM Context Management in Applications.

    Relevance levels: {relevance_levels}
    Domain labels: {domain_labels}
    Method labels: {method_labels}

    Papers:
    {paper_blocks}

    Return strict JSON array with exactly {count} objects, one per paper in order.
    Each object must use these exact keys:
    {{
      "relevance": "core|related|adjacent|irrelevant",
      "domain_primary": "one of the domain labels",
      "domain_secondary": ["optional second domain"],
      "method_tags": ["one or more method labels"],
      "tldr": "1-sentence summary (omit for irrelevant papers)",
      "rationale": "why this relevance and domain (omit for irrelevant papers)"
    }}

deepdive:
  system_prompt: |
    You are a careful research assistant extracting structured information.
    Return strict JSON only.
  user_prompt_template: |
    Analyze this paper:
    Title: {title}
    ---
    {body}
    ---
    Extract JSON with: problem, approach, evaluation, datasets, key_results.

taxonomy:
  system_prompt: |
    You are an expert research taxonomist classifying LLM context-management papers into a multi-dimensional taxonomy.

    Rules:
    - A paper can belong to MULTIPLE trees and MULTIPLE paths within each tree.
    - Assign paths at the LEAF level (e.g. "Position Encoding & Context Extension/RoPE & Extrapolation", not just "Position Encoding & Context Extension").
    - You MUST choose from the existing leaf nodes listed in the taxonomy below. Use EXACTLY the names as written.
    - Do NOT invent new leaf names. Do NOT use kebab-case. Do NOT abbreviate or rename categories.
    - If a paper does not fit any existing leaf, use "Other".
    - Cross-cutting tags are secondary attributes, not primary tree paths.
    - Output strict JSON only.
  trees:
    application-domain:
      "Chatbots & Conversational Agents": []
      "Autonomous Agents & Tool-use": []
      "Coding Assistants & IDEs": []
      "Multi-modal Applications": []
      "Scientific Research & Analysis": []
      "Enterprise & Productivity": []
      "Information Retrieval & Search": []
      "Data Analysis & Forecasting": []
      "General-purpose & Foundational Research": []
      "Domain-specific":
        - "Health & Medical"
        - "Education"
        - "Legal & Finance"
      "Other": []
    technical-approach:
      "Position Encoding & Context Extension":
        - "RoPE & Extrapolation"
        - "Interpolation (YaRN, NTK, PI)"
        - "Alternative Position Encodings (ALiBi, etc.)"
        - "Long-context Attention Architecture"
        - "Other"
      "KV-Cache Optimization":
        - "KV-Cache Quantization & Compression"
        - "KV-Cache Pruning & Eviction"
        - "Sparse KV Attention"
        - "Other"
      "Context Compression & Selection":
        - "Prompt Compression"
        - "Token Pruning & Selection"
        - "Summarization-based Compression"
        - "Other"
      "Memory Architecture":
        - "Short-term / Working Memory"
        - "Long-term External Memory (Vector DB, KG)"
        - "Memory Budget, Forgetting & Retrieval"
        - "Other"
      "Context Retrieval & Augmentation":
        - "In-context Demonstration Selection"
        - "Retrieval-Augmented Generation (RAG)"
        - "Other"
      "Context-aware Reasoning & Planning":
        - "Chain-of-Thought & Step-by-step Reasoning"
        - "Multi-step Planning"
        - "Tool-use & Agent Planning"
        - "Other"
      "Context Security & Trustworthiness":
        - "Prompt Injection & Jailbreak Defense"
        - "Context Leakage & Privacy"
        - "Hallucination Mitigation in Long Context"
        - "Other"
      "Session & Dialogue Management":
        - "Dialogue State Tracking"
        - "Multi-turn Context Coherence"
        - "Other"
      "Context Evaluation & Understanding":
        - "Long-context Benchmarks (Needle, Passkey)"
        - "Context Utilization & Attribution Analysis"
        - "Other"
      "Other": []
    research-goal:
      "Novel Method / Algorithm": []
      "Framework / System": []
      "Benchmark / Dataset": []
      "Empirical Study / Analysis": []
      "Theoretical Analysis": []
      "Survey / Position Paper": []
      "Other": []
  cross_cutting_tags:
    - "LLM"
    - "Multi-agent"
    - "Evaluation"
    - "Safety"
  flat_labels: {}
  auto_create_leaves: false
  auto_create_threshold: 0.8
  # ── Fully-automatic maintenance with deepseek-v4-pro judge ──
  auto_create_judge_model: "deepseek-v4-pro"
  auto_create_min_papers: 5
  auto_create_write_yaml: false
  auto_create_fallback: false
  user_prompt_template: |
    Classify the following papers using this taxonomy:

    {tree_description}

    For each paper, assign:
    1. One or more leaf paths per tree (e.g. "Position Encoding & Context Extension/RoPE & Extrapolation")
    2. Zero or more cross-cutting tags

    Papers to classify ({count}):
    ---
    {paper_blocks}
    ---

    Return strict JSON:
    {{
      "papers": [
        {{
          "paper_idx": 1,
          "application_domain": ["Domain-specific/Health & Medical"],
          "technical_approach": ["Position Encoding & Context Extension/RoPE & Extrapolation"],
          "research_goal": ["Benchmark / Dataset"],
          "cross_cutting": ["Evaluation"],
          "new_leaves": []
        }}
      ]
    }}
