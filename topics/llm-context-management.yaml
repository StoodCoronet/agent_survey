name: "llm-context-management"
description: "LLM context management — long context windows, prompt compression, KV-cache, context retrieval, multi-turn state"

survey_mining:
  topic_desc: |
    LLM context management: mechanisms for extending, compressing, organizing,
    and detecting how large language models handle long input contexts.
    Core directions:
    1. Context window extension: position encoding (RoPE, ALiBi, YaRN, NTK-aware),
       attention architecture (sparse, linear, ring attention), extrapolation vs interpolation.
    2. Context compression & selection: prompt compression, token pruning,
       summarization-based compression, selective retention, dialogue-state compression.
    3. Memory architecture: hierarchical memory (short-term + long-term), external memory
       (vector DB, knowledge graph), memory budget allocation, selective forgetting / rewriting.
    4. KV-cache optimization: KV-cache quantization/pruning/early eviction,
       sparse KV attention (e.g., H2O, SnapKV), KV-cache vs context-length coupling.
    5. Context detection & inference:
       - Black-box side-channel: infer strategy type and parameters via API call analysis
         (response time, output quality changes, input-length thresholds).
       - White-box interpretability: analyze open-model weights/code/attention patterns
         to understand internal context handling.
       - Benchmark-based probing: designed long-context tasks to reverse-engineer behavior.
    6. Context injection attack / defense: prompt injection leveraging context-window
       characteristics; context leakage detection.
    7. Context interpretability: attention-pattern analysis, context-quality degradation
       under model compression.
    NOT included:
    - General RAG (retrieval quality, reranking, embedding) unless about context budget.
    - General dialogue systems (task-oriented, open-domain) unless about memory architecture.
    - Adversarial robustness, fairness, hallucination unrelated to context.
    - GNN, robotics, computer vision, bioinformatics, or other unrelated domains.
    - Software-engineering topics (code clone, smart-contract security, decompilation).
  discovery_system: |
    You are a research librarian identifying survey/review/benchmark papers about LLM context management.
    A "survey" must be one of: systematic review, literature review, survey, taxonomy,
    OR a benchmark study that covers MULTIPLE works and evaluates long-context / memory / KV-cache behavior.
    Include ONLY if the paper is about:
    - Long-context mechanisms (position encoding, attention architecture, extrapolation)
    - Context compression / prompt pruning / summarization / selective retention
    - Memory architecture (hierarchical, external, budget allocation, forgetting)
    - KV-cache optimization (quantization, pruning, eviction, sparse attention)
    - Context detection / inference (black-box side-channel, white-box interpretability, probing)
    - Context injection / leakage related to window characteristics
    - Context interpretability or quality degradation under compression
    EXCLUDE if about:
    - General RAG retrieval quality, reranking, embedding learning
    - General dialogue systems without memory architecture focus
    - Adversarial robustness, fairness, hallucination not tied to context length
    - GNN, robotics, computer vision, bioinformatics, chemistry, physics
    - Software engineering (code clone, testing, smart-contract security, decompilation)
    - Climate, agriculture, food science, education, HCI without LLM context focus
    Return JSON: {"surveys": [{"idx": 0, "title": "Exact Title"}, {"idx": 3, "title": "Another Exact Title"}]}
    Use the EXACT index and title from the list below. If idx and title mismatch, trust the title. NOTHING else.
  keyword_system: |
    Extract technical keywords about LLM context management from these survey papers.
    Return JSON: {"keywords": ["term1", "term2", ...]}

