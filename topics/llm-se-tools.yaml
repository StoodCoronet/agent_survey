# ------ Classify (Stage 3) ------
classify:
  relevance_levels:
    - core
    - related
    - adjacent
    - irrelevant

  domain_labels:
    - "Code Generation / Synthesis"
    - "Testing / Test Generation"
    - "Debugging / Fault Localization"
    - "Program Repair / Patch Generation"
    - "Code Review / Quality Analysis"
    - "Vulnerability / Security Analysis"
    - "Documentation / Comprehension"
    - "Refactoring / Translation"
    - "Data Processing / Analysis / Transformation"
    - "Document / Knowledge Management"
    - "Research Assistance / Deep Research"
    - "Domain-Specific Tool"
    - "General-Purpose Assistant / Agent"

  method_labels:
    - "System/Tool"
    - "Benchmark/Dataset"
    - "Empirical Study"
    - "Survey/Review"
    - "Framework/Architecture"
    - "Evaluation Method"
    - "Case Study"
    - "Position Paper"

  core_venues:
    - ICSE
    - FSE
    - ASE
    - ISSTA
    - OOPSLA
    - PLDI
    - ESEC/FSE
    - MSR
    - ICSME
    - SANER
    - ISSRE
    - TOSEM
    - TSE
    - NeurIPS
    - ICML
    - ICLR
    - EMNLP
    - ACL
    - NAACL
    - AAAI
    - WWW
    - SIGIR
    - KDD
    - CHI
    - UIST

  system_prompt: |
    You are surveying tool and system papers that use LLMs to build
    practical systems.  Respond with strict JSON only.

    Classification criteria:

    1. RELEVANCE — four levels
       • core — proposes or evaluates a concrete tool/system that uses
         LLMs to solve a practical task.  Examples: code generation tools,
         testing/debugging/repair systems, data preprocessing tools
         (e.g. spreadsheet cleaning), document/knowledge management
         systems, research assistance tools (e.g. deep research, paper QA),
         domain-specific LLM applications.  Must have an implemented
         system or artifact (not just a model training recipe).
       • related — component technique relevant to LLM tools: prompt
         engineering, retrieval-augmented generation, LLM fine-tuning
         for applications, embedding/retrieval, agent architectures,
         human-in-the-loop design, or evaluation methodology for
         LLM systems.
       • adjacent — general LLM/agent work without a concrete tool/system
         (e.g. pure model training, theoretical agent frameworks, or
         commercial products without academic evaluation).
       • irrelevant — not about LLM-based tools or systems.

       IMPORTANT: Distinguish "tool/system paper" from "training paper":
       - Tool paper: "We built X that uses LLM to do Y" (evaluate on tasks)
       - Training paper: "We trained a 7B model on Z dataset" (evaluate on
         benchmarks like HumanEval, MMLU) → adjacent unless it builds a
         concrete application system.

    2. DOMAIN — pick ONE primary
       • Code Generation / Synthesis — generating, completing, or
         translating code with LLMs.
       • Testing / Test Generation — automated test case/oracle generation.
       • Debugging / Fault Localization — locating or explaining bugs.
       • Program Repair / Patch Generation — automatically fixing defects.
       • Code Review / Quality Analysis — static analysis, smell detection,
         review assistance.
       • Vulnerability / Security Analysis — security-focused detection/repair.
       • Documentation / Comprehension — doc generation, code summarization.
       • Refactoring / Translation — code transformation, modernization.
       • Data Processing / Analysis / Transformation — cleaning,
         transforming, or analyzing data (e.g. TradeSweep for spreadsheets,
         log analysis, config management).
       • Document / Knowledge Management — document understanding,
         knowledge base construction, information extraction from documents.
       • Research Assistance / Deep Research — tools for literature
         investigation, paper analysis, survey generation (overlap with
         automated-research topic but viewed as "tool" here).
       • Domain-Specific Tool — tools for specific domains (bioinformatics,
         legal, education, finance) using LLMs.
       • General-Purpose Assistant / Agent — multi-purpose agents
         (SWE-agent, coding agents, general assistants).

    3. METHOD — pick 1–3 tags
       • System/Tool — proposes or builds a concrete system.
       • Benchmark/Dataset — introduces or uses a benchmark/dataset.
       • Empirical Study — measurement, user study, or large-scale analysis.
       • Survey/Review — surveys existing tools.
       • Framework/Architecture — proposes a conceptual architecture.
       • Evaluation Method — new metric or evaluation protocol.
       • Case Study — real-world application report.
       • Position Paper — argues for a new direction.

  user_prompt_template: |
    You are labeling ONE paper for a survey of LLM-based tools and systems.

    Paper:
    - Title: {title}
    - Venue: {venue} ({year})
    - Abstract: {abstract}

    Label it with:

    1. `relevance`: one of {relevance_levels}.
       - core: concrete LLM tool/system for code engineering, data
         processing, document management, research assistance, or
         domain-specific tasks. Must have an implemented artifact.
         NOT a pure model training paper (e.g. "we train a 7B model").
       - related: component technique (prompt engineering, RAG,
         fine-tuning for applications, agent architecture, evaluation).
       - adjacent: pure model training, theoretical frameworks, or
         commercial products without academic evaluation.
       - irrelevant: unrelated.

    2. `domain_primary`: ONE from {domain_labels}. Required.

    3. `domain_secondary`: zero or more from {domain_labels}. Omit if none.

    4. `method_tags`: 1–3 from {method_labels}.

    5. `tldr`: one sentence summarizing the paper's contribution.

    Output format:
    {{"relevance": "...", "domain_primary": "...", "domain_secondary": [...], "method_tags": [...], "tldr": "..."}}

