# =============================================================================
# Topic: LLM-based Tools & Systems
# Survey tool/demo/system papers that use LLMs as a core technique to build
# practical systems solving engineering, knowledge, or data-processing tasks.
#
# Scope INCLUDES:
#   - Code engineering tools (generation, testing, debugging, repair, review)
#   - Data processing / analysis / transformation tools (e.g. TradeSweep)
#   - Document / knowledge management tools
#   - Research assistance / deep research / literature investigation tools
#   - Human-in-the-loop systems with LLM backends
#   - Agent-based systems for practical tasks (SWE-agent, Devin-like)
#   - Domain-specific LLM tools (bioinformatics, legal, education, etc.)
#
# Scope EXCLUDES (critical boundary):
#   - Pure model training / fine-tuning / architecture papers without
#     a concrete tool/system contribution (e.g. "we train a 7B code model")
#   - Empirical studies that use LLMs but do not propose a new tool/system
#   - Survey, position, or vision papers without implementation
#   - Theoretical algorithms without a deployed artifact
#
# Why this matters: This topic answers "what makes an LLM tool paper
# publishable at top venues?"  TradeSweep (ICSE 2025) is the archetype:
# focused problem + working system + rigorous evaluation.  Deep research
# systems belong here too — they are LLM tools for literature investigation.
# =============================================================================

name: "LLM-based Tools & Systems"
description: >
  Tool, demo, and system papers that use LLMs as a core technique to build
  practical systems: code engineering, data processing, document/knowledge
  management, research assistance, and domain-specific tools.  Excludes
  pure model training, empirical studies without tool contribution, and
  theoretical work without an artifact.

# ------ Survey Mining (Stage 3) ------
survey_mining:
  discovery_topic_desc: |
    Survey, review, and benchmark papers about LLM-based tools and systems
    for software engineering and related tasks: code generation and synthesis,
    testing and quality assurance, debugging and maintenance,
    data processing and content processing, document and knowledge management,
    and domain-specific applications. Excludes pure model training,
    literature investigation systems, and theoretical work without artifacts.
  discovery_system: |
    You are a strict research librarian identifying ONLY genuine survey/review/taxonomy papers about LLM-based tools and systems.

    STRICT inclusion criteria — ALL must be met:
    1. The paper MUST be a survey, systematic review, literature review, or taxonomy.
       Title or abstract should explicitly indicate survey nature (e.g., contains
       "survey", "review", "taxonomy", "systematic literature review", "state of the art",
       "overview", "landscape", "roadmap", "position paper with comprehensive coverage").
    2. OR it is a comprehensive benchmark study that compares MULTIPLE (>=5) prior
       works/tools/approaches and provides a systematic categorization/taxonomy.
       Single-benchmark papers (introducing one new dataset/tool) do NOT qualify.

    STRICT exclusion criteria — reject if ANY apply:
    - Title/abstract does NOT suggest survey/review nature (no "survey", "review",
      "taxonomy", "systematic", "overview", "landscape", "roadmap" keywords)
    - Empirical study on a single tool, system, or dataset
    - Benchmark paper introducing a new dataset without comprehensive multi-work comparison
    - Tool/demo paper proposing a single concrete system
    - Position or vision paper without systematic literature coverage
    - Automated literature investigation, deep research, paper QA, or SLR automation systems
      (see automated-research topic)
    - Pure model training or fine-tuning without a concrete tool/system
    - Theoretical algorithms without a deployed artifact
    - General NLP/AI work without SE or tool focus

    When in doubt, BE CONSERVATIVE: if the paper looks like a single empirical study
    or tool paper rather than a broad survey, EXCLUDE it.

    Return JSON: {"surveys": [{"idx": 0, "title": "Exact Title"}, ...]}
    Use the EXACT index and title from the list below. If idx and title mismatch, trust the title. NOTHING else.
  keyword_system: |
    You are an expert software engineering researcher extracting technical keywords from survey papers about LLM-based tools and systems.

    Focus on keywords related to:
    - Survey, review, and taxonomy papers about LLM-based tools and systems
    - Benchmark studies comparing multiple LLM-based tools
    - Code generation, completion, synthesis, and translation using LLMs
    - Automated testing, test generation, fuzzing, and quality assurance with LLMs
    - Debugging, fault localization, program repair, and code maintenance using LLMs
    - Data processing, analysis, transformation, and content processing using LLMs
    - Document understanding, knowledge base construction, and knowledge management using LLMs
    - Domain-specific LLM tools and agents for bioinformatics, legal tech, ed tech, fintech, medical, industrial, and climate applications
    - General-purpose LLM agents and assistants for practical tasks
    - Evaluation benchmarks, datasets, and metrics for LLM-based tools

    Rules:
    - Extract specific techniques, methods, frameworks, benchmarks, tools, and datasets
    - Include abbreviations and their expanded forms as separate entries
    - Exclude generic words (e.g., "code", "tool", "system"), author names, institution names
    - Each keyword 1-5 words, lowercase preferred
    - Only include keywords DIRECTLY relevant to LLM-based tools and systems

    Return JSON: {"keywords": ["term1", "term2", ...]}

