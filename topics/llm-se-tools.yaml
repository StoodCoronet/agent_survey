# ------ Taxonomy (Stage 7) ------
taxonomy:
  trees:
    task:
      label: "Application Task"
      categories:
        - name: "Code Engineering"
        - name: "Data Processing / Transformation"
        - name: "Document / Knowledge Management"
        - name: "Research Assistance"
        - name: "Domain-Specific Application"
        - name: "General-Purpose Assistant"
    technique:
      label: "Core LLM Technique"
      categories:
        - name: "Prompt Engineering"
        - name: "Retrieval-Augmented Generation"
        - name: "Fine-tuning / Domain Adaptation"
        - name: "Agent-based Interaction"
        - name: "Human-in-the-Loop"
        - name: "Embedding / Retrieval"
        - name: "Multi-Model Ensemble"
    evaluation:
      label: "Evaluation Approach"
      categories:
        - name: "Automated Benchmark"
        - name: "User Study"
        - name: "Case Study"
        - name: "A/B Comparison"
        - name: "Expert Evaluation"
  cross_cutting_tags:
    - "Open Source"
    - "Proprietary / Commercial"
    - "Uses LLM API"
    - "Requires Local Model"
    - "Human-in-the-Loop"
    - "Fully Automated"
    - "IDE Plugin"
    - "Web Interface"
    - "Command-Line Tool"
    - "Evaluated on Real Projects"
    - "Evaluated on Benchmark"
    - "User Study Conducted"
  flat_labels: {}

  # Auto-maintenance settings
  auto_create_leaves: true
  auto_create_threshold: 3
  auto_create_judge_model: "deepseek-v4-pro"
  auto_create_min_papers: 3
  auto_create_write_yaml: true
  auto_create_fallback: true

# ------ Deepdive extraction fields (Stage 5) ------
deepdive:
  system_prompt: |
    You are extracting structured information about an LLM-based tool
    or system from an academic paper.  Focus on tool characteristics,
    problem scope, and evaluation rigor.
  user_prompt_template: |
    Paper: {title}
    Authors: {authors}
    Venue: {venue} {year}
    Abstract: {abstract}

    Full text excerpt:
    {fulltext_excerpt}

    Extract the following structured fields:
    1. system_name: name of the proposed tool/system
    2. system_type: [tool, plugin, webapp, CLI, framework, benchmark, study]
    3. application_task: primary task [code engineering, data processing,
       document management, research assistance, domain-specific,
       general assistant, other]
    4. core_technique: primary LLM technique [prompt engineering, RAG,
       fine-tuning, agent, human-in-the-loop, embedding retrieval,
       multi-model, other]
    5. input: what the tool takes [natural language, code, data file,
       document, user query, other]
    6. output: what the tool produces [code, test, patch, cleaned data,
       summary, answer, structured knowledge, other]
    7. target_users: who uses it [developers, researchers, end users,
       domain experts, other]
    8. human_in_loop: does it involve human feedback? [yes, no]
    9. open_source: code available? [yes, no, partial]
    10. llm_used: which LLM (if specified)
    11. evaluation_method: [automated benchmark, user study, case study,
        expert evaluation, none, other]
    12. baseline_compared: baselines compared against (if any)
    13. key_metrics: main metrics reported (e.g. accuracy, BLEU, pass@k, SUS,
        task completion time, error rate)
    14. key_claims: 2-4 key contributions
    15. limitations_noted: limitations acknowledged
    16. relevance_to_tool_paper: how well does this exemplify a publishable
        LLM tool (1-5 scale, with justification).
        Consider: problem clarity, system completeness, evaluation rigor.
        TradeSweep (benchmark + user study) and deep research systems
        (end-to-end pipeline + automated metrics) are both good exemplars.
